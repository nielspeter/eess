name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter, deliberately. It filters the PR's BASE ref, so with
  # `[main]` a stacked PR — one whose base is another open branch — matched
  # nothing and ran zero gates. Measured on this repo's own PR #49, the one
  # fixing "four gates run in no workflow": `gh pr checks 49` reported none.
  # Stacked branches are how this repo works, so every PR gets the chain.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # check:release is a Diff-mode gate — it compares against the PR's base
          # commit. The default depth of 1 leaves no `origin/main` to resolve, and
          # the gate hard-errors rather than degrading to "nothing changed" (0106).
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Build first: dialects typecheck and test against the kernel's built
      # declarations (@nielspeter/eess resolves to packages/core/dist).
      - run: npm run build
      # Relink workspace bins now that dist exists. `npm ci` can't create the
      # `.bin/eess-ts` (etc.) symlinks pre-build (their `dist/cli/bin.js` targets
      # don't exist at install time), so the dogfood `check:*` gates below would
      # otherwise fail with `eess-ts: not found` (exit 127).
      - run: npm rebuild
      # Release readiness: a package cannot change without declaring a bump.
      # Placed first among the gates because a forgotten changeset is the most
      # mechanical failure in the chain and costs ~150ms to find. Needs the
      # fetch-depth: 0 above — this is the only gate that reads a base ref.
      # pull_request only: on a push, merge-base is HEAD and CI's tree is clean,
      # so the rule runs over an empty set and can never find anything. It says so
      # rather than printing a zero, but running it there is theatre — the PR run
      # is the gate, and the last point where a changeset can still be added.
      - run: npm run check:release
        if: github.event_name == 'pull_request'
      # Workspace guardrails: no phantom deps, all @nielspeter/eess* locally linked.
      - run: npm run check:integrity
      # Dogfood: eess-ts validates the family's own architecture (kernel purity, dialect isolation).
      - run: npm run check:arch
      # Dogfood: eess-ts validates each sibling dialect's standalone re-export completeness (plan 0089).
      - run: npm run check:family
      # Dogfood: the shipped `recommended` preset over this repo, against its baseline.
      - run: npm run check:baseline
      - run: npm run check:guardrails
      # Dogfood: eess-mermaid validates the kernel architecture diagram (plan 0060 charter).
      - run: npm run check:diagram
      # Dogfood: eess-crossvalidate — diagram↔code (both directions) + ADR↔test citations.
      - run: npm run check:crossval
      # Dogfood: the whole corpus (plans/adr/docs) — links, live pointers, ADR enforcement.
      - run: npm run check:corpus
      # Dogfood: honesty at close — a done record carries no undisposed `- [ ]`.
      - run: npm run check:ledger
      # Dogfood: eess-ts binds README Packages table + CLAUDE ADR-index to the code.
      - run: npm run check:spec
      # Work-item numbers are unique across every lane (plans, bugs, proposals).
      - run: npm run check:numbers
      # Every published check-constructor is probed for fail-open. Absent from
      # this file until PR #72's review found it — the ONLY step of `validate`
      # that was missing, on a branch that rewrote the script it runs. The
      # comment below claimed a meta-check prevented exactly this; it could not
      # (see `gateCoverage`), and now does.
      - run: npm run check:vacuity
      # Every gate above is proven non-vacuous: violating fixtures must make it exit 1.
      # Also proves every step of `validate` runs here — this list and the chain
      # in package.json are two lists of one thing, and were allowed to drift (0129,
      # and again with check:vacuity until PR #72). `gateCoverage` now reads THIS
      # file, so the claim is checked rather than asserted.
      - run: npm run check:nonvacuity
      - run: npm run typecheck
      # The vacuity matrix imports from `dist`, so it cannot join the pre-build
      # suite and lives behind its own script. It ran on NO path until PR #72's
      # review — 48 tests, invoked by nothing: not `test`, not `validate`, not
      # this file. `packages/ts/vitest.config.ts` justified the exclusion by
      # pointing at "an explicit post-build CI step"; this is that step, which
      # did not exist when the comment was written.
      - run: npm run test:matrix --workspace packages/ts
      - run: npm run check:examples
      - run: npm run check:docs-code
      # The review harness stays runnable against a foreign project.
      - run: npm run check:review-harness
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      # LAST, deliberately. GitHub Actions fails fast, so a step placed above the
      # suite hides it. The kernel-surface check sat mid-chain in its first
      # version and stopped `lint`, `format:check` and every test from running —
      # including the one ADR-011 row 2 names as its `gated` mechanism.
      - run: npm run check:surface
